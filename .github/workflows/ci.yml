name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download Mihomo core for the compatibility test
        run: |
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz | gunzip > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v
      - run: npm test
        env:
          MIHOMO_BIN: ${{ runner.temp }}/mihomo
      - run: npm run build
