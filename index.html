<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="隐私优先、浏览器本地运行的 Mihomo / OpenClash 配置工作台：把多个订阅 YAML 快照编译成一个完整 config.yaml。">
    <title>Mihomo Forge</title>
    <link rel="icon" href="./favicon.svg?v=anvil-tile" type="image/svg+xml">
    <!-- 小小东 UI Kit: theme, corners and accent applied before first paint (xxd-ui sync updates these files). -->
    <script src="/vendor/xxd/boot.js" data-key="mihomo-forge-ui" data-default-theme="system"></script>
    <link rel="stylesheet" href="/vendor/xxd/xxd.css">
    <style>
      /* Boot skeleton on the kit's tokens (xxd.css is already loaded above). */
      .boot { position: fixed; inset: 0; display: flex; background: var(--bg); }
      .boot-main { flex: 1; display: flex; flex-direction: column; gap: var(--space-3); max-width: 1040px; margin: 0 auto; padding: 0 var(--space-8); }
      .boot-top { height: 56px; margin: 0 calc(-1 * var(--space-8)) var(--space-6); border-bottom: 1px solid var(--line); }
      .boot-line, .boot-block { display: block; height: 12px; background: var(--wash-strong); animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot-line.tall { height: 28px; }
      .boot-block { height: 180px; margin-top: var(--space-4); }
      .w20 { width: 20%; } .w40 { width: 40%; } .w60 { width: 60%; }
      .boot-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      @keyframes boot-pulse { 50% { opacity: 0.55; } }
      @media (max-width: 640px) { .boot-main { padding: 0 var(--space-4); } .boot-top { margin: 0 calc(-1 * var(--space-4)) var(--space-6); } }
      @media (prefers-reduced-motion: reduce) { .boot-line, .boot-block { animation: none; } }
    </style>
  </head>
  <body class="xxd-page">
    <!-- Boot skeleton: previews the final layout until the app mounts (never a blank page). -->
    <div id="app">
      <div class="boot" aria-busy="true">
        <div class="boot-main">
          <span class="boot-top"></span>
          <span class="boot-line w20"></span>
          <span class="boot-line w40 tall"></span>
          <span class="boot-line w60"></span>
          <span class="boot-block"></span>
        </div>
        <span class="boot-status">Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
