<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="隐私优先、浏览器本地运行的 Mihomo / OpenClash 配置工作台：把多个订阅 YAML 快照编译成一个完整 config.yaml。">
    <title>Mihomo Forge</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <script>
      // Apply the theme before first paint to avoid a flash.
      (() => {
        let pref = 'system'
        try { pref = localStorage.getItem('mihomo-forge-theme') || 'system' } catch {}
        const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" media="print" onload="this.media='all'">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
